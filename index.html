<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2人の仲 - AI Chat Edition</title>

<style>
html, body {
  height: 100%; margin: 0; padding: 0; font-family: sans-serif;
  background: #0b0c10; overflow: hidden;
}

#bg {
  position: fixed; inset: 0;
  background-image: url("https://raw.githubusercontent.com/Shirumaka/HutariNoNaka/refs/heads/main/Images/MainBackground.png");
  background-position: center; background-size: cover; z-index: -2;
}

#char-wrap {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 100%; height: 75vh; display: flex; justify-content: center; align-items: center;
  pointer-events: none; z-index: 1;
}

#char { max-height: 100%; max-width: 90%; object-fit: contain; filter: drop-shadow(0 0 15px rgba(0,0,0,0.7)); }

#ui {
  position: fixed; bottom: 0; width: 100%; padding: 15px 15px 30px 15px;
  box-sizing: border-box; background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.7));
  border-top: 1px solid rgba(255,255,255,0.2); z-index: 10;
}

#name { color: #ffd37a; font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
#text { min-height: 4em; font-size: 1rem; line-height: 1.5; color: #e6e6e6; margin-bottom: 10px; }

/* AI入力欄のスタイル */
#input-area { display: flex; gap: 8px; margin-top: 10px; }
#player-input {
  flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
  color: white; padding: 10px; border-radius: 8px; outline: none;
}
#send-btn {
  background: #4facfe; color: white; border: none; padding: 0 20px;
  border-radius: 8px; cursor: pointer; font-weight: bold;
}
#send-btn:disabled { background: #555; cursor: not-allowed; }

#limit-info { font-size: 11px; color: #888; margin-top: 5px; text-align: right; }

#menu {
  position: fixed; inset: 0; background-image: url("https://raw.githubusercontent.com/Shirumaka/HutariNoNaka/main/Images/MenuBackground.png");
  background-position: center; background-size: cover; display: flex;
  flex-direction: column; justify-content: center; align-items: center; z-index: 9999;
}
#title { font-size: 3rem; color: white; margin-bottom: 20px; text-shadow: 0 0 10px black; }

#affectionWrap {
  position: fixed; top: 10px; left: 10px; width: 150px; background: rgba(0,0,0,0.5);
  padding: 8px; border-radius: 8px; z-index: 100;
}
#affectionBar { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
#affectionFill { width: 50%; height: 100%; background: linear-gradient(90deg, #4facfe, #00f2fe); transition: 0.3s; }
</style>
</head>
<body>

<div id="bg"></div>
<audio id="bgm" loop><source src="https://raw.githubusercontent.com/Shirumaka/HutariNoNaka/3e8d9dd68c2e326cd2d54317889de80cdadc1eec/Sounds/BGM.mp3" type="audio/mpeg"></audio>

<div id="menu">
  <div id="title">2人の仲</div>
  <button style="padding:15px 30px; font-size:1.2rem; cursor:pointer;" onclick="startGame()">スタート</button>
</div>

<div id="char-wrap"><img id="char" src=""></div>

<div id="ui" style="display:none;">
  <div id="name">彼</div>
  <div id="text"></div>
  <div id="input-area">
    <input type="text" id="player-input" placeholder="メッセージを入力...">
    <button id="send-btn" onclick="handleSend()">送信</button>
  </div>
  <div id="limit-info">今日の残り: <span id="remaining-count">-</span>回</div>
</div>

<div id="affectionWrap" style="display:none;">
  <div id="affectionBar"><div id="affectionFill"></div></div>
</div>

<script>
// --- 設定 ---
const API_KEY = "AIzaSyA9eJsLfTq3ujjdvq-Xxc7dK2D9ZGdNBOw"; // ここにGeminiのAPIキーを入力
const CHAT_LIMIT = 15; // 1日の会話回数制限

const face = {
  default: "https://raw.githubusercontent.com/Shirumaka/HutariNoNaka/main/Images/デフォルト.png",
  smile: "https://raw.githubusercontent.com/Shirumaka/HutariNoNaka/main/Images/スマイリー.png",
  sweat: "https://raw.githubusercontent.com/Shirumaka/HutariNoNaka/main/Images/冷や汗顔.png",
  angry: "https://raw.githubusercontent.com/Shirumaka/HutariNoNaka/main/Images/怒り.png",
  confuse: "https://raw.githubusercontent.com/Shirumaka/HutariNoNaka/main/Images/混乱.png",
  heart: "https://raw.githubusercontent.com/Shirumaka/HutariNoNaka/main/Images/目がハート.png",
  think: "https://raw.githubusercontent.com/Shirumaka/HutariNoNaka/main/Images/考える.png"
};

let relationship = 0;
let typing = false;
let chatCount = 0;

// --- 回数制限の管理 ---
function checkLimit() {
  const today = new Date().toLocaleDateString();
  const savedDate = localStorage.getItem('last_chat_date');
  if (savedDate !== today) {
    localStorage.setItem('last_chat_date', today);
    localStorage.setItem('chat_usage', '0');
    chatCount = 0;
  } else {
    chatCount = parseInt(localStorage.getItem('chat_usage') || '0');
  }
  updateLimitDisplay();
}

function updateLimitDisplay() {
  document.getElementById("remaining-count").innerText = Math.max(0, CHAT_LIMIT - chatCount);
}

// --- AI通信 ---
async function askAI(message) {
  if (chatCount >= CHAT_LIMIT) {
    typeText("今日はもう疲れちゃったみたい…。また明日話そう？");
    return;
  }

  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
  
  // プロンプト（キャラ設定）
  const prompt = `あなたは親しい「彼」というキャラクターです。
今の好感度は-10から10の間の「${relationship}」です。
短い1〜2文で、友達以上恋人未満のような距離感で返答してください。
また、あなたの表情を[smile, default, sweat, angry, confuse, heart, think]の中から1つ選び、末尾に {face:表情名} の形式で付けてください。`;

  try {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: `${prompt}\nプレイヤー: ${message}` }] }] })
    });

    const data = await response.json();
    const rawText = data.candidates[0].content.parts[0].text;
    
    // 表情抽出とテキスト整形
    const faceMatch = rawText.match(/\{face:(.*?)\}/);
    const aiFace = faceMatch ? faceMatch[1].trim() : "default";
    const cleanText = rawText.replace(/\{face:.*?\}/, "");

    // 好感度の簡易判定（AIがプラスな単語を使ったら＋1、など簡易的に）
    if (cleanText.includes("嬉しい") || cleanText.includes("好き")) relationship++;
    if (cleanText.includes("嫌い") || cleanText.includes("ひどい")) relationship--;
    
    setFace(aiFace);
    updateAffectionBar();
    typeText(cleanText);

    chatCount++;
    localStorage.setItem('chat_usage', chatCount.toString());
    updateLimitDisplay();

  } catch (e) {
    typeText("……電波が悪いのかな？（APIエラー）");
    console.error(e);
  }
}

// --- ユーティリティ ---
function updateAffectionBar(){
  const min = -10; const max = 10;
  let p = (relationship - min) / (max - min) * 100;
  document.getElementById("affectionFill").style.width = Math.max(0, Math.min(100, p)) + "%";
}

function setFace(k){ document.getElementById("char").src = face[k] || face.default; }

function typeText(text, cb){
  let i = 0; typing = true;
  document.getElementById("text").innerText = "";
  const t = setInterval(() => {
    document.getElementById("text").innerText += text[i++];
    if(i >= text.length){ clearInterval(t); typing = false; cb?.(); }
  }, 30);
}

async function handleSend() {
  const input = document.getElementById("player-input");
  const btn = document.getElementById("send-btn");
  const msg = input.value.trim();
  if (!msg || typing) return;

  input.value = "";
  btn.disabled = true;
  await askAI(msg);
  btn.disabled = false;
}

// Enterキーでも送信可能に
document.getElementById("player-input")?.addEventListener("keypress", (e) => {
  if (e.key === "Enter") handleSend();
});

function startGame(){
  document.getElementById("menu").style.display = "none";
  document.getElementById("ui").style.display = "block";
  document.getElementById("affectionWrap").style.display = "block";
  document.getElementById("bgm").play().catch(()=>{});
  checkLimit();
  updateAffectionBar();
  setFace("default");
  typeText("久しぶりだね。今日は何してたの？");
}
</script>
</body>
</html>
